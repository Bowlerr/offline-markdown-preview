name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit

  e2e:
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.90.0', stable]
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (VS Code and exported artifacts)
        env:
          OMV_E2E_VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e
      - name: Package extension
        if: matrix.vscode == 'stable'
        run: npm run package
      - name: Upload verified package
        if: matrix.vscode == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: offline-markdown-preview-vsix
          path: '*.vsix'
          if-no-files-found: error
          overwrite: true
      - name: Upload E2E evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence-${{ matrix.vscode }}
          path: test-results/
          overwrite: true
